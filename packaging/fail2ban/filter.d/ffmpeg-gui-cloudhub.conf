# Fail2ban filter for ffmpeg-gui-cloudhub
# Matches standardized [security] failed login attempt warnings emitted in:
# 1) Python application server logs (cloudhub.log or systemd journal)
# 2) Standard W3C / Nginx Combined Log Format in HTTP access.log (HTTP 401 Unauthorized or 429 Too Many Requests)

[Definition]
failregex = ^.*\[security\] Failed (?:CloudHub login|password) attempt for (?:non-existent user |valid user )?'.*' from <HOST>(?:\s|$)
            ^<HOST> - \S+ \[.*?\] "POST /api/hub/auth/login(?:\?[^"\s]*)? HTTP/[^"]+" (?:401|429)(?:\s|$)

ignoreregex =
